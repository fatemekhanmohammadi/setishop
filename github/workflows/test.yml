name: Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: setishop_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run migrations
        working-directory: ./core
        env:
          PGDB_NAME: setishop_test
          PGDB_USER: postgres
          PGDB_PASSWORD: postgres
          PGDB_HOST: localhost
          PGDB_PORT: 5432
          SECRET_KEY: test-secret-key
          DEBUG: "1"
        run: python manage.py migrate

      - name: Run tests
        working-directory: ./core
        env:
          PGDB_NAME: setishop_test
          PGDB_USER: postgres
          PGDB_PASSWORD: postgres
          PGDB_HOST: localhost
          PGDB_PORT: 5432
          SECRET_KEY: test-secret-key
          DEBUG: "1"
          CELERY_BROKER_URL: redis://localhost:6379/0
          CELERY_RESULT_BACKEND: redis://localhost:6379/0
        run: pytest

      - name: Run flake8
        run: |
          pip install flake8
          flake8 core --max-line-length=120 --exclude=migrations